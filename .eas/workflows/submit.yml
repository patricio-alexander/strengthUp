name: Deploy To Production

on:
  push:
    branches: ["main"]

jobs:
  build_android:
    name: Build Android App
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Android
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
